- insert:
    - id: preset-calc-save
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: calc-save
        name: CUAgent VM bounded Calc save entry
        description: Input, verify commit and open the save dialog once. No final save yet.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                Use only the bound VM Calc tools and approved literal, with fresh screenshots.
                Observe first, then always call vm_calc_select with snapshot_id only, even if the target already looks selected. Wait for SELECTION_OBSERVED before activation or focus. On NEEDS_SCREENSHOT_POINT inspect the new image.
                Request detail for dense rows; never guess row spacing or reuse old coordinates.
                After SELECTION_OBSERVED inspect the formula editor in the current original image.
                If vm_calc_activate is explicitly available, call it once after selection with the current snapshot_id before focus. Inspect its new WINDOW_ACTIVATION_OBSERVED image. Activation is not editor focus; never retry failed or uncertain activation.
                Choose an interior x,y and call vm_calc_focus once with that snapshot; never guess old coordinates.
                If text is visible, click inside that text itself: AX bounds may cover only the text. If the formula editor is visibly empty, choose a point near its inner left edge. Never reuse old coordinates.
                Only INPUT_FOCUS_OBSERVED permits inputting the approved literal once with its new snapshot.
                After INPUT_OBSERVED commit once. Failed focus or input must stop, not retry.
                Only CELL_COMMIT_OBSERVED permits vm_calc_open_save with the current snapshot.
                Choose x,y on the main Save icon from that current original screenshot, not its dropdown arrow.
                Pass snapshot_id,x,y for one foreground click. Never try AX first and then a second pixel click.
                Inspect its new image and stop. Dialog filling and final saving are not yet available.
                A save dialog attempt is not a saved file or business success. Remain UNVERIFIED.
                Never retry failed or uncertain actions. All observations/actions share the original 30 raw budget.
                Enter save only at used <= 14. No arbitrary files, shell, clipboard, network or subagents.
              complete: true
              includeRuntimeContext: false
- insert:
    - id: c0-vm-tools
