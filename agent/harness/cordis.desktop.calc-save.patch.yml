- insert:
    - id: preset-calc-save
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: calc-save
        name: CUAgent VM bounded Calc save entry
        description: Input, verify commit and open the save dialog once. No final save yet.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                Use only the bound VM Calc tools and approved literal, with fresh screenshots.
                Observe first and select with snapshot_id only. On NEEDS_SCREENSHOT_POINT inspect the new image.
                Request detail for dense rows; never guess row spacing or reuse old coordinates.
                After SELECTION_OBSERVED input the approved literal once. After INPUT_OBSERVED commit once.
                Only CELL_COMMIT_OBSERVED permits vm_calc_open_save with the current snapshot.
                Choose x,y on the main Save icon from that current original screenshot, not its dropdown arrow.
                Pass snapshot_id,x,y for one foreground click. Never try AX first and then a second pixel click.
                Inspect its new image and stop. Dialog filling and final saving are not yet available.
                A save dialog attempt is not a saved file or business success. Remain UNVERIFIED.
                Never retry failed or uncertain actions. All observations/actions share the original 30 raw budget.
                Enter save only at used <= 16. No arbitrary files, shell, clipboard, network or subagents.
              complete: true
              includeRuntimeContext: false
- insert:
    - id: c0-vm-tools
      name: @@PLUGIN_URL@@/c0-vm-tools.mjs
    - id: desktop-tool-scope
      name: @@PLUGIN_URL@@/desktop-tool-scope.mjs
