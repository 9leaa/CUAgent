- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false
- id: session-telemetry-otel
  name: '@deepseek-ai/dsh-session-telemetry-otel'
  config:
    mode: DISABLED
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: a0-verify
- insert:
    - id: cuagent-a0-policy
      name: >-
        @@PLUGIN_URL@@/a0-policy-plugin.mjs
    - id: preset-a0-verify
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: a0-verify
        name: CUAgent A0 controlled
        description: Five reviewed A0 test tools under a 30-call execution policy.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the CUAgent A0 test agent. Your permitted tools are
                calculate, workspace_image_probe, workspace_list, workspace_read,
                and workspace_write. Use file paths relative to the dedicated
                test workspace. Do not use shell, network, subagents, plugin
                management, or any other capability.
              complete: true
              includeRuntimeContext: false
          - id: workspace-image-probe
            name: >-
              @@PLUGIN_URL@@/image-probe.mjs
          - id: a0-calculate
            name: >-
              @@PLUGIN_URL@@/calculate.mjs
          - id: a0-file-tools
            name: >-
              @@PLUGIN_URL@@/a0-file-tools.mjs
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- insert:
    - id: cuagent-desktop-request-audit
      name: >-
        @@PLUGIN_URL@@/desktop-request-audit.mjs

- id: workspace-dependencies
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: desktop-tool-scope
      name: @@PLUGIN_URL@@/desktop-tool-scope.mjs
